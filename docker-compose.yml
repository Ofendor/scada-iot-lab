services:
  database:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: scadalts
      MYSQL_USER: scadalts
      MYSQL_PASSWORD: scadalts
    ports:
      - "3306:3306"

  scadalts:
    image: scadalts/scadalts:latest
    ports:
      - "8181:8080"
    depends_on:
      - database
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: scadalts
      DB_USER: scadalts
      DB_PASSWORD: scadalts

  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
